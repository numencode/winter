title = "Page not found (404)"
url = "/404"
layout = "default"
is_hidden = 0

[viewBag]
localeTitle[sl] = "Stran ne obstaja (404)"
==
<section class="error-page">
    <div class="container text-center">
        <p class="error-page__code">404</p>
        <h1 class="h2">{{ 'Page not found'|_ }}</h1>
        <p class="lead text-body-secondary">{{ 'The page you are looking for does not exist.'|_ }}</p>
        <a class="btn btn-primary mt-3" href="{{ 'home'|staticPage }}">{{ 'Back to the home page'|_ }}</a>
    </div>
</section>
