{#
    The document head. A demo site: search engines are asked not to index it (also robots.txt and the
    X-Robots-Tag header in .htaccess).
#}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ (this.page.meta_title ?: this.page.title) ~ ' · NumenCode Demo' }}</title>
{% if this.page.meta_description %}
    <meta name="description" content="{{ this.page.meta_description }}">
{% endif %}
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#1c1638">
<link rel="icon" type="image/svg+xml" href="{{ 'assets/images/favicon.svg'|theme }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="{{ 'assets/css/theme.css'|theme }}">
{% styles %}
