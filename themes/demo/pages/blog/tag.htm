title = "Blog tag"
url = "/blog/tag/:slug/:page?"
layout = "default"
is_hidden = 0

[blogTagFilter]
slug = "{{ :slug }}"
pageNumber = "{{ :page }}"
postsPerPage = 10
postPage = "blog/post"
categoryPage = "blog/category"
tagPage = "blog/tag"
==
<div class="container">
    <div class="page-header">
        <p><a href="{{ 'blog/blog'|page }}">&larr; All posts</a></p>
    </div>
    {% component 'blogTagFilter' %}
</div>
