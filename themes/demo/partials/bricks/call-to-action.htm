{#
    Brick "call-to-action". Variables: the fields (title, content), the page's variables and
    brick = {code, index, field, anchor, class}.
#}
<section class="brick brick--call-to-action{% if brick.class %} {{ brick.class }}{% endif %}"{% if brick.anchor %} id="{{ brick.anchor }}"{% endif %}>
    {% if title %}
        <h2 class="brick__title">{{ title }}</h2>
    {% endif %}
    {% if content %}
        <div class="brick__content">{{ content|raw }}</div>
    {% endif %}
</section>
